services:
  - type: web
    name: lms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_BASE_URL
        value: https://lms-production-ce6f.up.railway.app/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
