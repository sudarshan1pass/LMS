services:
  - type: web
    name: lms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://lms-frontend-production-0a3b.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
